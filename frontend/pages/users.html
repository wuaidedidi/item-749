<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="洗衣店订单管理系统 - 用户管理">
    <title>用户管理 - 洗衣店管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css?v=2">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">🧺</div>
                    <span class="sidebar-logo-text">洗衣店</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">主菜单</div>
                    <a href="dashboard.html" class="nav-item"><span class="nav-item-icon">📊</span><span class="nav-item-text">控制台</span></a>
                    <a href="orders.html" class="nav-item"><span class="nav-item-icon">📋</span><span class="nav-item-text">订单管理</span></a>
                    <a href="customers.html" class="nav-item"><span class="nav-item-icon">👥</span><span class="nav-item-text">客户管理</span></a>
                    <a href="services.html" class="nav-item"><span class="nav-item-icon">🛠️</span><span class="nav-item-text">服务项目</span></a>
                </div>
                <div class="nav-section" id="adminSection">
                    <div class="nav-section-title">系统管理</div>
                    <a href="users.html" class="nav-item active"><span class="nav-item-icon">👤</span><span class="nav-item-text">用户管理</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">账户</div>
                    <a href="profile.html" class="nav-item"><span class="nav-item-icon">⚙️</span><span class="nav-item-text">个人中心</span></a>
                    <a href="javascript:void(0)" class="nav-item" onclick="auth.logout()"><span class="nav-item-icon">🚪</span><span class="nav-item-text">退出登录</span></a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left"><h1 class="header-title">用户管理</h1></div>
                <div class="header-right">
                    <div class="header-user" id="headerUser">
                        <div class="user-avatar" id="userAvatar">AD</div>
                        <div class="user-info">
                            <span class="user-name" id="userName">管理员</span>
                            <span class="user-role" id="userRole">管理员</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">用户列表</h3>
                        <button class="btn btn-primary" onclick="showAddModal()">+ 添加用户</button>
                    </div>
                    <div class="card-body">
                        <div class="toolbar">
                            <div class="toolbar-left">
                                <div class="search-box">
                                    <span class="search-box-icon">🔍</span>
                                    <input type="text" id="searchInput" placeholder="搜索用户...">
                                </div>
                                <select class="form-control filter-select" id="roleFilter">
                                    <option value="">全部角色</option>
                                    <option value="1">管理员</option>
                                    <option value="0">员工</option>
                                </select>
                                <select class="form-control filter-select" id="statusFilter">
                                    <option value="">全部状态</option>
                                    <option value="1">正常</option>
                                    <option value="0">禁用</option>
                                </select>
                            </div>
                        </div>
                        <div id="userTable"><div class="loading"><div class="spinner"></div></div></div>
                        <div id="pagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (!auth.requireAuth()) throw new Error('未登录');
        if (!auth.isAdmin()) { window.location.href = 'dashboard.html'; throw new Error('无权限'); }

        let currentPage = 1;
        const pageSize = 10;
        let filters = { keyword: '', role: '', status: '' };

        document.addEventListener('DOMContentLoaded', async () => {
            const user = auth.getUser();
            if (user) {
                document.getElementById('userName').textContent = user.realName || user.username;
                document.getElementById('userRole').textContent = user.role === 1 ? '管理员' : '员工';
                document.getElementById('userAvatar').textContent = utils.getInitials(user.realName || user.username);
            }

            document.getElementById('searchInput').addEventListener('input', utils.debounce((e) => {
                filters.keyword = e.target.value; currentPage = 1; loadUsers();
            }, 300));
            document.getElementById('roleFilter').addEventListener('change', (e) => {
                filters.role = e.target.value; currentPage = 1; loadUsers();
            });
            document.getElementById('statusFilter').addEventListener('change', (e) => {
                filters.status = e.target.value; currentPage = 1; loadUsers();
            });

            await loadUsers();
        });

        async function loadUsers() {
            try {
                const response = await userApi.getList({ ...filters, page: currentPage, pageSize });
                if (response.code === 200) {
                    renderTable(response.data.list);
                    Pagination.create({
                        container: document.getElementById('pagination'),
                        page: currentPage, pageSize, total: response.data.total,
                        onChange: (page) => { currentPage = page; loadUsers(); }
                    });
                }
            } catch (error) { Toast.error('错误', error.message); }
        }

        function renderTable(data) {
            const currentUser = auth.getUser();
            Table.render({
                container: document.getElementById('userTable'),
                columns: [
                    { title: '用户名', key: 'username' },
                    { title: '姓名', key: 'realName' },
                    { title: '电话', key: 'phone' },
                    { title: '邮箱', key: 'email' },
                    { title: '角色', key: 'role', render: (val) => 
                        `<span class="badge ${val === 1 ? 'badge-primary' : 'badge-secondary'}">${val === 1 ? '管理员' : '员工'}</span>` },
                    { title: '状态', key: 'status', render: (val) => 
                        `<span class="badge ${val === 1 ? 'badge-success' : 'badge-secondary'}">${val === 1 ? '正常' : '禁用'}</span>` },
                    { title: '操作', key: 'id', width: '250px', render: (id, row) => {
                        const isCurrentUser = currentUser && currentUser.id === id;
                        return `
                            <div class="table-actions">
                                <button class="btn btn-sm btn-secondary" onclick="showEditModal(${id})">编辑</button>
                                ${!isCurrentUser ? `<button class="btn btn-sm btn-${row.status === 1 ? 'warning' : 'success'}" onclick="toggleStatus(${id}, ${row.status})">${row.status === 1 ? '禁用' : '启用'}</button>` : ''}
                                <button class="btn btn-sm btn-info" onclick="showResetPasswordModal(${id})">重置密码</button>
                                ${!isCurrentUser ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${id})">删除</button>` : ''}
                            </div>
                        `;
                    }}
                ],
                data, emptyText: '暂无用户数据'
            });
        }

        function showAddModal() {
            const modal = Modal.create({ title: '添加用户', content: getFormHtml(), size: 'lg' });
            setupFormHandlers(modal, null);
        }

        async function showEditModal(id) {
            try {
                const response = await userApi.getById(id);
                if (response.code === 200) {
                    const modal = Modal.create({ title: '编辑用户', content: getFormHtml(response.data, true), size: 'lg' });
                    setupFormHandlers(modal, response.data);
                }
            } catch (error) { Toast.error('错误', error.message); }
        }

        function getFormHtml(data = {}, isEdit = false) {
            return `
                <form id="userForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label required">用户名</label>
                            <input type="text" class="form-control" name="username" value="${data.username || ''}" ${isEdit ? 'readonly' : ''} required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">真实姓名</label>
                            <input type="text" class="form-control" name="realName" value="${data.realName || ''}">
                        </div>
                    </div>
                    ${!isEdit ? `<div class="form-group">
                        <label class="form-label required">密码</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>` : ''}
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">电话</label>
                            <input type="tel" class="form-control" name="phone" value="${data.phone || ''}">
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" name="email" value="${data.email || ''}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">角色</label>
                        <select class="form-control" name="role">
                            <option value="0" ${data.role === 0 ? 'selected' : ''}>员工</option>
                            <option value="1" ${data.role === 1 ? 'selected' : ''}>管理员</option>
                        </select>
                    </div>
                    <div class="modal-footer" style="margin: -24px; margin-top: 24px; padding: 16px 24px;">
                        <button type="button" class="btn btn-secondary" onclick="Modal.close(this.closest('.modal-overlay'))">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            `;
        }

        function setupFormHandlers(modal, existing) {
            modal.body.querySelector('#userForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = Object.fromEntries(formData);
                data.role = parseInt(data.role);

                try {
                    if (data.phone && !utils.isValidPhone(data.phone)) throw new Error('手机号格式不正确');
                    if (data.email && !utils.isValidEmail(data.email)) throw new Error('邮箱格式不正确');

                    if (existing) { await userApi.update(existing.id, data); Toast.success('成功', '用户已更新'); }
                    else { await userApi.create(data); Toast.success('成功', '用户已添加'); }
                    modal.close(); loadUsers();
                } catch (error) { Toast.error('错误', error.message); }
            });
        }

        async function toggleStatus(id, currentStatus) {
            try {
                await userApi.updateStatus(id, currentStatus === 1 ? 0 : 1);
                Toast.success('成功', '状态已更新');
                loadUsers();
            } catch (error) { Toast.error('错误', error.message); }
        }

        function showResetPasswordModal(id) {
            const modal = Modal.create({
                title: '重置密码',
                content: `
                    <form id="resetPasswordForm">
                        <div class="form-group">
                            <label class="form-label required">新密码</label>
                            <input type="password" class="form-control" name="password" minlength="6" required>
                            <small class="text-muted">至少6个字符</small>
                        </div>
                        <div class="modal-footer" style="margin: -24px; margin-top: 24px; padding: 16px 24px;">
                            <button type="button" class="btn btn-secondary" onclick="Modal.close(this.closest('.modal-overlay'))">取消</button>
                            <button type="submit" class="btn btn-primary">确认重置</button>
                        </div>
                    </form>
                `
            });

            modal.body.querySelector('#resetPasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = e.target.querySelector('[name="password"]').value;
                try {
                    await userApi.resetPassword(id, password);
                    Toast.success('成功', '密码已重置');
                    modal.close();
                } catch (error) { Toast.error('错误', error.message); }
            });
        }

        async function deleteUser(id) {
            const confirmed = await Modal.confirm({ title: '删除用户', message: '确定要删除该用户吗？此操作不可撤销。', danger: true });
            if (confirmed) {
                try { await userApi.delete(id); Toast.success('成功', '用户已删除'); loadUsers(); }
                catch (error) { Toast.error('错误', error.message); }
            }
        }
    </script>
</body>
</html>
